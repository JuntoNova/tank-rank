      <p>The living board is a working consensus order for the 2027 class. This list is college and international. The heading shows the real board size — today, 100 players — not a fake Top 300.</p>
      <p>Each row carries theory-adjusted estimates for All-Star, All-NBA, years, and Hall of Fame from draft-night traits. Those numbers are estimates, not guarantees. Tiny Hall odds print as <code>&lt;1%</code>, not <code>0%</code>. Missing scoring lines stay blank; the board does not invent a college season. Method lives on <a href="./methodology.html">Methodology</a>.</p>
      <h2>A worked example: Tyran Stokes at #1</h2>
      <p>Stokes sits first on the 2027 board (Kansas, forward). The Hall of Fame cell is <code>&lt;1%</code> on the live GLM path — age, size, and origin without a scored college line — not a scouting slogan and not a slot prior. Argue with <a href="./theories.html">Theories</a>, then come back to the <a href="./board.html?year=2027">board</a>.</p>
      <h2>What the columns mean</h2>
      <ul>
        <li><strong>AS / 1st / All-NBA / HOF</strong> — estimated career honors from the theory model.</li>
        <li><strong>Yrs / Chips / MVP</strong> — expected counts on the same path.</li>
        <li><strong>PPG / RPG / APG / BLK</strong> — career-rate projections when a pre-draft line exists; blank when it does not.</li>
        <li><strong>No P(Bust)</strong> — no published bust definition, so the column stays off.</li>
      </ul>
      <h2>What this site is not</h2>
