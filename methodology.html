  <script>
    TR.renderSimple(document.getElementById("app"), "method", "Methodology", "The spec",
      `<p>Estimand: expected NBA career honors and per-game rates given facts knowable on draft night. Age, size, origin, and the last pre-draft scoring line. Not the pick. Not reputation. Not NBA box scores.</p>
      <p>That is a mean, E[Y|X]. Holdout Spearman on expected All-Star games is 0.13. Pick alone is 0.24 / AUC 0.78. We lose to the slot on purpose. The number is not a ranking of who will be great. It is the average career of people who looked like this, most of whom were ordinary.</p>

      <h2>The model</h2>
      <p>Hurdle GLM. Coefficients fit on draftees 1947–2004 (n = 3,424). Penalty, Poisson shrink, year shrink, and intercept shift chosen on 1995–2004 without looking at 2005–2014. That slice (n = 600) is locked and only used to report.</p>
      <ul>
        <li>Inner slice for the knobs: 1995–2004. L2 penalty on Brier.</li>
        <li>Intercept shift from five-fold out-of-fold predictions on 1947–2004, penalty frozen. The holdout does not pick the shift.</li>
        <li>Then refit on 1947–2004 and score 2005–2014.</li>
        <li>Expected count = P(ever) × E[count | ever]. Poisson count, shrunk toward the All-Star mean.</li>
        <li>Hall of Fame is not a 20-feature logistic. 1–3 All-Stars in 1980–1998 were about 2.7% Springfield. 4+ All-Stars were about 77%. Never-All-Star is not a Hall path. Cap 15%. Floor 0.02%. Printed ≤15% at the cap, not a ranking among people on the ceiling.</li>
        <li>MVP: 31 MVPs in 1947–2004, every one an All-Star. E[MVP] = P(All-Star) × 0.155. A 17-feature MVP logistic on 31 events ranked shot blockers. That is not a ranking.</li>
        <li>Career PPG / RPG / APG / BPG are a separate ridge on the same draft-night traits, trained on players with 100+ games. Not honors in different units. Blocks are official from 1973–74. Box plus-minus is not a column; it is missing for too much of the file and it is not a counting stat.</li>
      </ul>

      <h2>Holdout 2005–2014, against simpler models</h2>
      <p>Same 600 players. None of these comparison fits saw that slice when the knobs were picked. The pick row is the thing we refuse to use.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Model</th><th>AUC</th><th>Brier</th><th>Spearman</th><th>Mean P</th></tr></thead>
        <tbody>
          <tr><td>Intercept only</td><td>0.50</td><td>0.083</td><td>—</td><td>9.2%</td></tr>
          <tr><td>Age and size</td><td>0.67</td><td>0.082</td><td>0.08</td><td>10.5%</td></tr>
          <tr><td>College box only</td><td>0.61</td><td>0.083</td><td>0.12</td><td>10.9%</td></tr>
          <tr><td>Full model, no pick</td><td>0.72</td><td>0.076</td><td>0.13</td><td>9.4%</td></tr>
          <tr><td>Pick (not in the product)</td><td>0.78</td><td>0.074</td><td>0.24</td><td>11.5%</td></tr>
        </tbody>
      </table></div>
      <p>Actual All-Star rate on the holdout is 9.2%. Age and size already do most of the ranking. The college line helps a little and keeps the average honest. Using the pick would look better. That is the identification cost: the score has to come from the player.</p>
      <p>Career rates on the same holdout, players with 100+ games: PPG MAE 3.5 (mean 9.2). RPG MAE 1.2. APG MAE 0.9. BPG MAE 0.19 (mean 0.45). Grey bands on those columns are a residual 10–90, not a promise.</p>

      <h2>Stocks: uncapped vs capped vs zeroed</h2>
      <p>Same 2005–2014 holdout. Same frozen knobs. Only the draft-night steal and block values change.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Rule</th><th>AUC</th><th>Brier</th><th>Spearman</th><th>Mean P</th></tr></thead>
        <tbody>
          <tr><td>Uncapped stocks</td><td>0.73</td><td>0.076</td><td>0.23</td><td>9.1%</td></tr>
          <tr><td>Blocks capped at 2.0 (in the product)</td><td>0.74</td><td>0.077</td><td>0.24</td><td>8.4%</td></tr>
          <tr><td>Zero stocks at predict</td><td>0.72</td><td>0.079</td><td>0.23</td><td>6.9%</td></tr>
        </tbody>
      </table></div>
      <p>Draft-night expected All-Stars under those rules:</p>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>College blk</th><th>Uncapped</th><th>Capped (live)</th><th>Zeroed</th></tr></thead>
        <tbody>
          <tr><td>Eddie Griffin</td><td>4.4</td><td>3.3</td><td>1.6</td><td>1.0</td></tr>
          <tr><td>Glenn Mosley</td><td>4.3</td><td>3.0</td><td>1.3</td><td>0.4</td></tr>
          <tr><td>Yi Jianlian</td><td>2.2</td><td>3.5</td><td>3.3</td><td>1.7</td></tr>
          <tr><td>Shaquille O'Neal</td><td>5.2</td><td>3.6</td><td>1.7</td><td>1.0</td></tr>
          <tr><td>David Robinson</td><td>4.5</td><td>4.3</td><td>2.2</td><td>0.9</td></tr>
          <tr><td>Anthony Davis</td><td>5.8</td><td>2.9</td><td>1.3</td><td>0.3</td></tr>
          <tr><td>Magic Johnson</td><td>0.1</td><td>3.1</td><td>3.1</td><td>2.7</td></tr>
        </tbody>
      </table></div>
      <p>Griffin and Mosley were the mint. Yi barely moves: 7-0, 19 years old, 25 points, 2.2 blocks. That is size and scoring, not stocks. Zeroing stocks to put him under Magic also puts Shaq and AD under a 1. We cap. We do not hand-edit Yi.</p>

      <h2>The grey range on honors</h2>
      <p>The big number is the fit on the whole training file. The small grey range on All-Star / years / HOF is a 10th–90th interval from 80 refits on reshuffled training history, same frozen knobs. That is sampling uncertainty of the coefficients. It is not a prediction interval for the career. It does not cover a missing college line or a wrong height. Fultz at about 2 All-Stars with a range around it is a 23-and-6 freshman line, not a promise.</p>

      <h2>Features in the player score</h2>
      <p>Age relative to the era median, clipped to 17–25.5. Listed height and weight. Height vs the usual guy at that position. Pounds per inch, wingspan, ape, standing reach, listed swing. Prep-to-pro / international origin. A 6-7+ creation flag. College (or pro) points and assists when we have them. McDonald's All-American from 1977 on. College FT% when we have it.</p>
      <p>Steals and blocks are in the file. For honors, blocks are capped at 2.0 and steals at 2.5. A night of 4.4 blocks is scored as 2.0. Zeroing stocks entirely killed Shaq and AD and under-called the All-Star rate (6.9% vs 9.2%). The cap keeps the holdout and stops Eddie Griffin and Glenn Mosley from looking like inner-circle stars. Hall still skips stocks. Springfield is not a shot-blocking contest.</p>
      <p>College counting stats are centered on a typical draftee line (16 / 2.5 / 1.2 / 0.7), not the star-selected subset we have typed. International lines are centered on a typical pro line (10 / 2 / 1 / 0.8). High school box scores are a different unit and are skipped. Extreme college scoring is winsorized for honors; the PPG ridge keeps 28+ college lines. McDonald's All-American is a binary from 1977 on; pre-1977 is missing, not a zero. College FT% is skip-missing, centered on 72%. High school counting stats are stored as HS and never scored as college points.</p>
      <p>Missing production is omitted, not imputed as a typical college line. No points line means no career PPG (printed —). Same for rebounds and assists. Age, size, and origin still fire. A trained miss_pts dummy moves honors when the scoring line is absent. About 57% of packs have no points line. The board does not invent a college season.</p>

      <h2>Data dictionary</h2>
      <ul>
        <li>Last pre-draft season in the theory pack: college, or the last season against men for internationals. Not a career peak. Not a high school line. High school senior lines, when we have them, are labeled HS and live in hs_pts / hs_reb / hs_ast / hs_blk.</li>
        <li>McDonald's All-American (Basketball-Reference awards page, 1977–2026). Missing before 1977. 0 after 1977 means he was not on the team.</li>
        <li>College FT% from the last pre-draft season. Skip if missing. Career NBA FT% is the stickiness check, not a projection column.</li>
        <li>Height and weight are listed numbers. Combine height is not a separate file yet.</li>
        <li>Age is draft-night age, clipped to 17–25.5, centered on the era median.</li>
        <li>Position is the listed string. Swing is two listed spots vs one.</li>
        <li>All-Star, All-NBA, years, chips, MVP, Hall are career totals in history/*.json.</li>
        <li>Career PPG/RPG/APG/BPG are Basketball-Reference career rates. Blocks are official from 1973–74. No college block line means no projected BPG (printed —).</li>
      </ul>

      <h2>Calibration, 2005–2014</h2>
      <p>600 holdout draftees, sorted by expected All-Star games. p-hat is E[AS] / 3.96, the training All-Star mean among All-Stars. Actual is the share who made at least one All-Star game.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Quintile</th><th>p-hat</th><th>Actual P(AS)</th><th>E[AS]</th><th>Actual AS</th></tr></thead>
        <tbody>
          <tr><td>1 (lowest)</td><td>2.0%</td><td>1.7%</td><td>0.08</td><td>0.03</td></tr>
          <tr><td>2</td><td>4.3%</td><td>5.8%</td><td>0.17</td><td>0.15</td></tr>
          <tr><td>3</td><td>6.1%</td><td>4.2%</td><td>0.24</td><td>0.13</td></tr>
          <tr><td>4</td><td>9.5%</td><td>13.3%</td><td>0.38</td><td>0.57</td></tr>
          <tr><td>5 (highest)</td><td>22.4%</td><td>20.8%</td><td>0.89</td><td>1.24</td></tr>
        </tbody>
      </table></div>
      <p>The ranking is coarse and the top quintile is still mostly not All-Stars. The mean is honest. That is what 0.13 Spearman looks like in a table.</p>

      <h2>All-Star ever coefficients (predict-time)</h2>
      <p>Intercept −2.81. Missingness dummies other than miss_pts/miss_ast are estimated in training and set to 0 at predict. miss_pts and miss_ast fire when that line is absent. Blocks and steals are then capped (2.0 / 2.5) before this linear predictor for honors.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Feature</th><th>Coef</th></tr></thead>
        <tbody>
          <tr><td>College / pro points</td><td>+0.52</td></tr>
          <tr><td>Listed swing</td><td>+0.44</td></tr>
          <tr><td>Relative age (younger is positive)</td><td>−0.42</td></tr>
          <tr><td>Tall creator flag</td><td>+0.38</td></tr>
          <tr><td>Blocks (then capped)</td><td>+0.37</td></tr>
          <tr><td>Steals (then capped)</td><td>+0.33</td></tr>
          <tr><td>International origin</td><td>−0.32</td></tr>
          <tr><td>Weight</td><td>−0.28</td></tr>
          <tr><td>Pounds per inch</td><td>+0.25</td></tr>
          <tr><td>Assists</td><td>+0.23</td></tr>
          <tr><td>High school origin</td><td>+0.17</td></tr>
          <tr><td>McDonald's All-American</td><td>+0.10</td></tr>
          <tr><td>College FT%</td><td>+0.00</td></tr>
        </tbody>
      </table></div>

      <h2>Error cases</h2>
      <p>Draft-night E[AS] vs what happened. These are the slides. We do not tune them by hand.</p>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>Draft-night E[AS]</th><th>Career AS</th><th>Why</th></tr></thead>
        <tbody>
          <tr><td>Kevin Durant, 2007</td><td>4.3</td><td>16</td><td>18, 6-11, 26 points. The model’s high tail. Still a mean, not 27 PPG.</td></tr>
          <tr><td>Magic Johnson, 1979</td><td>3.7</td><td>12</td><td>19, 6-9, 8.4 assists. The identification working.</td></tr>
          <tr><td>Markelle Fultz, 2017</td><td>3.6</td><td>0</td><td>23-and-6 freshman line. Production, not blocks. Residual.</td></tr>
          <tr><td>Yi Jianlian, 2007</td><td>3.6</td><td>0</td><td>7-0, 19, 25 points, 2.2 blocks. Size and scoring. The cap barely moves him.</td></tr>
          <tr><td>Eddie Griffin, 2001</td><td>1.7</td><td>0</td><td>Was ~3.3 uncapped on 4.4 blocks. Cap is why he is not a top-10 prospect.</td></tr>
          <tr><td>Shaquille O’Neal, 1992</td><td>2.0</td><td>15</td><td>The cost of the cap. 5.2 blocks count as 2.0.</td></tr>
          <tr><td>Anthony Davis, 2012</td><td>1.6</td><td>10</td><td>Same cost. 14 college points and 5.8 blocks, capped.</td></tr>
          <tr><td>Steve Nash, 1996</td><td>0.2</td><td>8</td><td>Santa Clara 17 and 6 at 22. Nobody’s model should have seen two MVPs. This one does not.</td></tr>
          <tr><td>Nikola Jokić, 2014</td><td>0.5</td><td>8</td><td>Mega 11.4 against men. Honest miss. He is the Over list, not a 15% Hall on draft night.</td></tr>
          <tr><td>Michael Jordan, 1984</td><td>1.2</td><td>14</td><td>UNC line fires. High school 27.8 is labeled HS, not college.</td></tr>
          <tr><td>LeBron James, 2003</td><td>0.6</td><td>22</td><td>High school 31.6 is skipped as college production. McDonald's AA is ×1.10, not a 30-point college season.</td></tr>
        </tbody>
      </table></div>

      <h2>What would change a pick</h2>
      <p>This is not a draft board. Pick AUC 0.77 vs our 0.72. If a team used only these numbers they would not have taken Nash at 15, and they would not have seen Jokić. They would have been less excited about Griffin after the cap. They would still have Fultz high because of 23-and-6. Decision utility vs the slot is the identification cost, not a bug we forgot to patch.</p>

      <h2>What we tried and dropped</h2>
      <ul>
        <li>Draft slot. Identification: the score has to come from the player.</li>
        <li>Guard / center flags on top of scoring and passing. They stacked.</li>
        <li>Two-position listing as a talent signal. It was a proxy for “we wrote a scouting report.” (Listed swing is still in, as two spots vs one.)</li>
        <li>Steals+blocks as one number plus blocks again. Rim was counting twice.</li>
        <li>Letting raw 4-block seasons mint All-Stars. Cap 2.0 on honors. Hall still skips stocks.</li>
        <li>A 20-feature Hall of Fame logistic. Rare event, too many knobs.</li>
        <li>A 17-feature MVP logistic on 31 events.</li>
        <li>Picking the penalty on the same slice we report.</li>
      </ul>

      <h2>What we estimate</h2>
      <ul>
        <li>Expected All-Star games, All-NBA, first-team, years, championships, MVPs</li>
        <li>P(Hall of Fame) from All-Star quality, capped at 15%</li>
        <li>Expected career PPG, RPG, APG, BPG (mean; residual band in grey)</li>
      </ul>
      <p>All-NBA cannot exceed All-Star. First-team is 22% of expected All-NBA. Championships are miscalibrated on the holdout (predicted 2.1%, rate 0.7%) because labels are incomplete; we do not shift chips down to that rate, and we do not pretend the column is a ranking. No bust label. That is not an objective outcome.</p>

      <h2>Limits that are in the number</h2>
      <ul>
        <li>Spearman 0.13. Griffin is not a 3-All-Star prospect. Yi still ranks high because he is 7-0 with 25 points at 19, not because he blocked 2 shots.</li>
        <li>The college line is the draft-year season we have, not a career peak.</li>
        <li>25 college PPG usually becomes about 11 NBA PPG among guys who stuck, not 27. Durant is the right tail of his own forecast.</li>
        <li>1947–2004 is not 2027. Relative age helps. Production is still mixed-era.</li>
        <li>2027–2029 high schoolers have no college line. Age, size, and McDonald's All-American still fire. Hall odds on those cards are capped, and weak.</li>
      </ul>

      <h2>What this page is for</h2>
      <p>If a theory is not in the GLM feature list (age, size, origin, create_tall, pts, ast, stl, blk, hs_elite, ft), it is a table on Theories, not a player score. Blocks are capped at 2.0 for honors. Combine, free-throw rate, threes, schools, development, and stash are looked at. They are not scored. If this page and the live glm-coefs.json disagree, the JSON wins and this page is wrong.</p>
      <p>Scoring is <code>assets/theory-model.js</code> plus <code>assets/glm-coefs.js</code>. Chrome is a pinned local <code>app.pinned.js</code>, not a jsDelivr eval. <code>node pipeline/test-invariants.mjs</code> checks the Griffin cap, no pick in features, and that this page still matches the file.</p>`
    );
  </script>
