  <script>
    TR.renderSimple(document.getElementById("app"), "method", "Methodology", "The spec",
      `<p>We fit what happened after past drafts from facts that were knowable on draft night. Pick is not one of those facts. NBA career box scores are not either.</p>

      <h2>The model</h2>
      <p>A hurdle GLM. Trained on draftees 1947–2004. Tested on 2005–2014.</p>
      <ul>
        <li>Logistic P(ever All-Star / All-NBA / MVP / champion). L2 penalty. The penalty is chosen on holdout Brier, a proper scoring rule, not on ranking AUC alone.</li>
        <li>Poisson E[count | it happened] on the players who did, shrunk toward the All-Star mean so a good college line is not ten All-Star games.</li>
        <li>Expected count = P(ever) × E[count | ever].</li>
        <li>P(ever All-Star) and P(ever All-NBA) get an intercept shift on the holdout so the average matches the historical rate. Rank order is unchanged.</li>
        <li>Years: ridge linear, then an intercept shift so the holdout mean matches.</li>
        <li>Hall of Fame: P(HOF | All-Star) × P(All-Star) + P(HOF | never) × (1 − P(All-Star)). About 34% of All-Stars in the file are in Springfield, and about 0.4% of the rest. A 20-feature HOF logistic overfits a 4% label. This does not.</li>
      </ul>
      <p>Holdout AUC for ever-All-Star is 0.68. Mean predicted P(All-Star) on the holdout is 9.5%, same as the actual rate. That is modest on purpose: we are not allowed to use the pick, and most draftees are zeros. It is a real out-of-sample number, not a story we typed.</p>

      <h2>Features</h2>
      <p>Age relative to the era median, clipped to 17–25.5 so a bad birthdate is not a 6-year-old prodigy. Listed height and weight. Height vs the usual guy at that position. Prep-to-pro / international origin. A 6-7+ creation flag. College points, assists, steals, blocks when we have them. Wingspan minus height when we have it.</p>
      <p>College counting stats are centered on a typical draftee line (16 points, 2.5 assists, 1.2 steals, 0.7 blocks), not on the star-selected subset we have typed (~19 points). Extreme lines are winsorized: 44 points is not four times a 22-point season. Missing production is skipped at predict. It does not impute a star line, and it does not apply a hand-typed cap.</p>

      <h2>What we tried and dropped</h2>
      <ul>
        <li>Draft slot. Identification: the score has to come from the player.</li>
        <li>Guard / center flags on top of scoring and passing. They stacked.</li>
        <li>Two-position listing. It was the largest raw coefficient, and it was a proxy for “we wrote a scouting report” (27% All-Star vs 8%). After scoring and passing were in the model it came out.</li>
        <li>Steals+blocks as one number plus blocks again. Rim was counting twice.</li>
        <li>A 20-feature Hall of Fame logistic. Rare event, too many knobs, 96% for players who were not going to Springfield.</li>
      </ul>

      <h2>What we do not use</h2>
      <ul>
        <li>Draft slot.</li>
        <li>NBA counting stats.</li>
        <li>Reputation, scouting adjectives, or “everyone knew.”</li>
      </ul>
      <p>The old slot-prior table is still in the repo. It does not score a player anymore.</p>

      <h2>What we estimate</h2>
      <ul>
        <li>Expected All-Star games, All-NBA, first-team, years, championships, MVPs</li>
        <li>P(Hall of Fame) as a calibrated function of P(All-Star), floored at 0.3% and capped at 28%</li>
      </ul>
      <p>No bust label. That is not an objective outcome.</p>

      <h2>Limits that are in the number</h2>
      <ul>
        <li>The college line is the draft-year season we have, not a career peak. A 21-year-old junior at 19.6 points is not the same input as an 18-year-old at 31.</li>
        <li>We do not have a college or international line for most of the file. Those theories do not fire. Age, size, and origin still do.</li>
        <li>A 6-8 who blocked 4 shots a night looks, to this model, like a shot-blocking star. Most of those guys were not. That miss is in the 0.68 AUC.</li>
        <li>Championship labels on the 2005–2014 holdout are incomplete, so we do not shift chips down to that rate.</li>
        <li>First-team All-NBA is 22% of expected All-NBA, not a separately fitted count.</li>
      </ul>

      <h2>Pack vs depth (2027)</h2>
      <p>Theory-pack features cover picks 1–62. The living board runs to about 100. Picks 63–100 are depth fills with thinner inputs. No invented bios. No invented odds.</p>

      <h2>What this page is for</h2>
      <p>Assumptions, features, coefficients, and failed tests land here. If it is not on this page, it is not part of the model.</p>`
    );
  </script>
