  <script src="./assets/nav-swap.js?v=30"></script>
  <script>
    TR.renderSimple(document.getElementById("app"), "method", "Methodology", "The spec",
      `<p>We fit what happened after past drafts, then apply that fit to players who have not been drafted yet.</p>

      <h2>The idea</h2>
      <p>Take every completed class we can measure. For each pick, record what was knowable on draft night (age, size, school, production, origin) and what happened later (years, All-Stars, All-NBA, championships, MVP, Hall of Fame). Run regression on that history. Use the coefficients to estimate the same outcomes for 2027–2029.</p>
      <p>Historic boards already show the two sides of that coin: <em>When drafted</em> is the slot prior. <em>Now</em> is the realized career. The model is the map from the first to the second.</p>

      <h2>What we estimate</h2>
      <ul>
        <li>P(All-Star)</li>
        <li>P(All-NBA)</li>
        <li>P(Hall of Fame)</li>
        <li>Expected years, championships, MVPs</li>
      </ul>
      <p>No bust label. That is not an objective outcome.</p>

      <h2>Assumptions</h2>
      <ul>
        <li>Players drafted in similar slots, with similar measurable traits, have similar outcome distributions.</li>
        <li>Draft-night information is the only legal input. Later NBA box scores do not leak into a pre-draft score.</li>
        <li>College, high school, and international prospects can be scored on one board if origin is an explicit feature.</li>
        <li>The league changes. Era is a feature, not a reason to throw the sample out.</li>
        <li>A coefficient that does not beat the slot prior gets dropped.</li>
      </ul>

      <h2>First test: size</h2>
      <p>Claim: “you can’t teach size,” so height and weight should predict honors after we already know the pick.</p>
      <p>Sample for this pass: listed Basketball-Reference height/weight joined to 3,072 drafted players, picks 1–60, classes 1947–2018. Combine wingspan is not in this pass. Honors file is still incomplete (Yao Ming is 7-6 and an eight-time All-Star in real life, missing from the overlay).</p>
      <ul>
        <li>Raw All-Star rate does not rise with height. 6-0 to 6-2: 12.8%. 6-6 to 6-8: 13.0%. 7-0 to 7-2: 8.9%. 7-3 and up: 17 players, not a star factory.</li>
        <li>7-4 and taller draftees in the file: Ralph Sampson (All-Star), Rik Smits (All-Star), Priest Lauderdale (no), Shawn Bradley (no), Yao Ming (yes, missing in file), Manute Bol (no), Gheorghe Mureșan (no), Hasheem Thabeet (no). The bet that “most 7-4 guys become All-Stars” is false.</li>
        <li>Logistic P(All-Star) ~ height: McFadden R² = 0.001. ~ pick: 0.088. ~ height + pick: 0.093. Height adds almost nothing once the slot is known.</li>
        <li>Sign on height after controlling for pick is slightly negative. At pick 10 the fitted P(All-Star) is higher at 6-0 than at 7-4. Teams already use the extra-tall picks on the players they think can play. Extra inches on top of that do not buy more honors.</li>
        <li>Heavier is not better either. 260+ lbs: 3.6% All-Star. Under 180: 15.4%. Weight is mixed up with position and era.</li>
      </ul>
      <p>Working rule from this test: keep height and weight as features. Do not let them outrank the slot prior. Rare heights (7-3+) get a wide interval, not a star prior.</p>

      <h2>Sample</h2>
      <ul>
        <li>Training window: completed drafts, 1947–2026.</li>
        <li>Holdout: recent classes whose careers are still open get less weight, not zero weight.</li>
        <li>Living board: 2027, 2028, 2029. Predictions only. No career labels yet.</li>
      </ul>

      <h2>Specs</h2>
      <p>This section fills in as the first model ships. Until then the working stack is:</p>
      <ul>
        <li>Family: logistic regression for binary honors; linear / Poisson for counts.</li>
        <li>Baseline: empirical rates by pick bucket (the <em>When drafted</em> view).</li>
        <li>Validation: out-of-era and out-of-slot tests against the baseline.</li>
        <li>Publication rule: a number only goes on the site if we can write the regression that produced it.</li>
        <li>A theory stays N/A until it beats the slot prior on a locked sample.</li>
      </ul>

      <h2>What this page is for</h2>
      <p>Assumptions, features, coefficients, and failed tests land here. If it is not on this page, it is not part of the model.</p>`
    );
  </script>
