      <p>Mainstream NBA draft coverage is still expert-driven. Independent models exist, but none own the consumer big-board market. The Draft Model is a Junto Nova project — a DBA of Junto Nova — built for fans who want a deep Top 300 split across college / high school / international, and honest about uncertainty.</p>
      <p>Long-term the site is a ranking + graphics + commerce machine. Draft traffic pays for the brand; year-round lists keep it alive.</p>
