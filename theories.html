<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Theories | The Draft Model</title>
  <meta name="description" content="Draft theories scored against historic NBA drafts." />
  <link rel="canonical" href="https://thedraftmodel.com/theories.html" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#090a0c" />
  <link rel="stylesheet" href="./assets/styles.css?v=36" />
  <link rel="stylesheet" href="./assets/theories.css?v=36" />
</head>
<body>
  <div id="app"></div>
  <script src="./assets/data.js?v=36"></script>
  <script src="./assets/app.js?v=36"></script>
  <script src="./assets/nav-swap.js?v=36"></script>
  <script>
    const theories = [
      {
        name: "You can't teach size",
        href: "./size.html",
        pill: "3\u00d7 MVP",
        cls: "num",
        outliers: [
          { k: "7-0 to 7-2", v: "3\u00d7 MVP odds" },
          { k: "250\u2013259 lb", v: "3\u00d7 MVP odds" },
          { k: "6-11", v: "3\u00d7 MVP odds" },
          { k: "6-8", v: "0 MVPs in 314" },
          { k: "All-Star", v: "no lift" }
        ]
      },
      { name: "College production is the best signal", pill: "N/A", cls: "na" },
      { name: "The best players play at the best schools", pill: "N/A", cls: "na" },
      { name: "March Madness tells you everything", pill: "N/A", cls: "na" },
      { name: "Younger is better at the same pick", pill: "N/A", cls: "na" },
      { name: "One-and-done beats four-year stars", pill: "N/A", cls: "na" },
      { name: "International is a different market", pill: "N/A", cls: "na" },
      { name: "Defense doesn't show up until the league", pill: "N/A", cls: "na" }
    ];
    const html = theories.map((t) => {
      const title = t.href
        ? `<a class="theory-name" href="${t.href}">${t.name}</a>`
        : `<span class="theory-name">${t.name}</span>`;
      const plus = t.outliers
        ? `<button class="theory-plus" data-acc type="button" aria-label="Toggle">+</button>`
        : `<span class="theory-plus ghost"></span>`;
      const panel = t.outliers
        ? `<div class="acc-panel"><div class="factor-list">${t.outliers.map((f) =>
            `<div class="factor"><span>${f.k}</span><b>${f.v}</b></div>`
          ).join("")}</div></div>`
        : "";
      return `<div class="acc-item theory-acc">
        <div class="theory-row">
          ${plus}
          ${title}
          <span class="theory-pill ${t.cls}">${t.pill}</span>
        </div>
        ${panel}
      </div>`;
    }).join("");
    TR.renderSimple(
      document.getElementById("app"),
      "theories",
      "Theories",
      "",
      `<div class="acc theory-list">${html}</div>`
    );
    document.querySelectorAll("[data-acc]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        const item = btn.closest(".theory-acc");
        item.classList.toggle("open");
        btn.textContent = item.classList.contains("open") ? "\u2212" : "+";
      });
    });
  </script>
</body>
</html>
