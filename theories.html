<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Theories | The Draft Model</title>
  <meta name="description" content="The arguments NBA teams actually have on draft night, written plainly, then checked against history when we can." />
  <link rel="canonical" href="https://thedraftmodel.com/theories.html" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#090a0c" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Draft Model" />
  <meta property="og:title" content="Draft Theories | The Draft Model" />
  <meta property="og:description" content="The arguments NBA teams actually have on draft night, written plainly." />
  <meta property="og:url" content="https://thedraftmodel.com/theories.html" />
  <meta property="og:image" content="https://thedraftmodel.com/assets/og.jpg" />
  <link rel="stylesheet" href="./assets/styles.css?v=85" />
  <link rel="stylesheet" href="./assets/theories.css?v=54" />
</head>
<body>
  <div id="app"></div>
  <script src="./assets/data.js?v=42"></script>
  <script src="./assets/app.js?v=84"></script>
  <script src="./assets/nav-swap.js?v=90"></script>
  <script>
    const groups = [
      {
        label: "Body",
        items: [
          { name: "Bigger is better", href: "./size.html", pill: "Checked", cls: "num",
            cuts: ["What people say: You cannot teach height or strength. Take the bigger guy.", "What we found: Size moves the odds a little. It does not beat the pick itself."] },
          { name: "Bigger than the position helps", href: "./size.html", pill: "Checked", cls: "num",
            cuts: ["What people say: It is not raw height. It is height at the position.", "What we found: Three extra inches vs the usual guy at that position shows up in All-Star, All-NBA, Hall of Fame, and MVP."] },
          { name: "Guys who can play more than one position do better", href: "./size.html", pill: "Checked", cls: "num",
            cuts: ["What people say: A LeBron who can play all five beats a Shaq or a Muggsy locked to one spot.", "What we found: Players listed at two spots do better. Being 6-5 to 6-9 is not enough by itself."] },
          { name: "Long arms help on defense", href: "./wingspan.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Wingspan matters more than listed height when you have to guard people.", "What we found: Longer arms do show up in All-Star and All-NBA rates. We do not have a clean defense award test yet."] },
          { name: "Tall guys who can dribble are rare", href: "./handle.html", pill: "Checked", cls: "num",
            cuts: ["What people say: A 6-foot-8 player who can pass and handle is the hardest thing to find.", "What we found: That is mostly true. Big creators become All-Stars more often than bigs who cannot create."] },
          { name: "How high he can reach beats how high he jumps", href: "./reach.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Standing reach is the useful number. Max vertical is a combine trick.", "What we found: Not true for everyone. It only helps the very tall, 6-foot-10 and up."] },
          { name: "Workout numbers do not mean much", href: "./combine.html", pill: "Checked", cls: "num",
            cuts: ["What people say: The lane agility drill and the bench press do not tell you who can play.", "What we found: Half true. The clock and the bench move the odds a bit. Max vertical does not. Skipping the combine is mostly about pick slot, not talent."] }
        ]
      },
      {
        label: "Age",
        items: [
          { name: "How old he is on draft night", href: "./age.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Younger guys last longer and develop more. Older guys contribute faster and are safer to stick.", "What we found: Younger guys do last longer, and they become All-Stars more often. Older guys do not produce more per year, and they do not stick more often. Draft slot is not in this check."] },
          { name: "Some players get good late, and teams miss them", href: "./late.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Older college stars are cheap because everyone is obsessed with freshmen.", "What we found: Not really. Older high scorers do not beat younger ones at the same pick."] },
          { name: "One year of college is enough if you are a star", href: "./onedone.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Freshmen who leave early are better bets than four-year stars.", "What we found: Mostly true, and a lot of that is just age. Freshmen hit All-Star more often than seniors."] },
          { name: "Getting better in year two means more than a huge freshman year", href: "./jump.html", pill: "Checked", cls: "num",
            cuts: ["What people say: A real leap as a sophomore is a better sign than one flashy freshman season.", "What we found: No. Freshman flashes still win. The big year-two jump is a weaker signal."] },
          { name: "Leave a raw foreign player overseas until he is ready", href: "./stash.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Stashing a young big in Europe cuts the risk that he is not ready.", "What we found: It does cut the risk that he never arrives. It is not a proven way to find extra stars."] }
        ]
      },
      {
        label: "How he plays",
        items: [
          { name: "College stats tell you who will be good", href: "./prod.html", pill: "Checked", cls: "num",
            cuts: ["What people say: If he scored a lot in college, he will score in the NBA.", "What we found: Barely. High college scorers are only a little more likely to become All-Stars than low ones."] },
          { name: "Guys who get fouled a lot can get to the rim", href: "./ftrate.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Drawing fouls is the honest version of being able to drive.", "What we found: True. High free-throw rate players become All-Stars about twice as often. Shooting percentage alone is flat."] },
          { name: "Taking a lot of threes matters more than a hot percentage", href: "./three.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Volume and the shot diet matter. A small-sample percentage does not.", "What we found: Neither version wins cleanly. High three-point volume and high percentage both look ordinary."] },
          { name: "Passing travels better than scoring", href: "./astu.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Assist-to-usage is the smart way to measure a creator. Raw assists lie.", "What we found: Creation itself helps. The fancy ratio is not clearly better than counting assists."] },
          { name: "College defense does not tell you anything", href: "./defense.html", pill: "Checked", cls: "num",
            cuts: ["What people say: You cannot see NBA defense in college stats. Scoring is what boards overweight.", "What we found: False. College steals-plus-blocks do show up. The high-stocks group becomes All-Stars about twice as often."] },
          { name: "You still need a big who can block shots", href: "./rim.html", pill: "Checked", cls: "num",
            cuts: ["What people say: A defense without a rim protector leaks at the basket.", "What we found: True for bigs. High-block centers and power forwards do better. It is flat if you mix in every position."] }
        ]
      },
      {
        label: "School, country, and team",
        items: [
          { name: "The best players come from the best colleges", href: "./schools.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Duke, Kentucky, and the other blue bloods concentrate future stars.", "What we found: False once you know the pick. Mid-lottery players from other schools do just as well."] },
          { name: "Foreign players are a different kind of bet", href: "./intl.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Overseas prospects are priced wrong next to college players at the same pick.", "What we found: At the very top, college wins. Later in the draft it is a wash."] },
          { name: "The team that drafts him matters as much as the player", href: "./develop.html", pill: "Checked", cls: "num",
            cuts: ["What people say: Put him in the right program and he becomes a star. Put him in the wrong one and he dies.", "What we found: We cannot prove a team bonus yet. Honors still follow the pick more than the logo."] }
        ]
      },
      {
        label: "Arguments we cannot check yet",
        kind: "qual",
        items: [
          { name: "Guarding every position matters more than blocking shots", href: "./switch.html", pill: "Not yet", cls: "na",
            cuts: ["What people say: In a switch-everything league, a big who can guard wings is worth more than a rim protector.", "What we found: We do not have a pre-draft switch tag. The opposite claim, that you still need a shot-blocker, is checked on the rim page."] },
          { name: "Tournament games show you who is clutch", href: "./march.html", pill: "Not yet", cls: "na",
            cuts: ["What people say: March tells you what the regular season hid.", "What we found: We do not have a player-matched NCAA tournament box to test this."] },
          { name: "He only works in our system", href: "./scheme.html", pill: "Not yet", cls: "na",
            cuts: ["What people say: A lot of reaches are fit calls, not talent errors.", "What we found: We do not have a draft-night scheme tag for each pick."] },
          { name: "Hidden injuries change everything", href: "./medical.html", pill: "Not yet", cls: "na",
            cuts: ["What people say: Front offices see the MRI. Public boards do not.", "What we found: There is no public imaging series, so we cannot score this."] },
          { name: "Off-court warning signs predict busts", href: "./character.html", pill: "Not yet", cls: "na",
            cuts: ["What people say: Makeup red flags move a board even when the talent is real.", "What we found: There is no public character-flag list and no shared definition of a bust."] },
          { name: "Shooting can be taught", pill: "Not yet", cls: "na",
            cuts: ["What people say: Take the athlete. You can teach him to shoot later.", "What we found: We have not built a shot-development series yet. The three-point page only tests college shooting, not who learned it after the draft."] },
          { name: "He plays harder than everyone else", pill: "Not yet", cls: "na",
            cuts: ["What people say: Motor, competing on every trip, is the thing film people will not give up.", "What we found: Effort is real. It is also not in any public table we can score."] },
          { name: "He just knows where to be", pill: "Not yet", cls: "na",
            cuts: ["What people say: Feel and basketball IQ separate players who last from athletes who wash out.", "What we found: No public IQ series. Closest checked signals are passing and age."] },
          { name: "Always take the best player, not the one you need", pill: "Not yet", cls: "na",
            cuts: ["What people say: Drafting for a hole on tonight's roster is how you miss stars.", "What we found: We can see who got picked. We cannot yet tag whether the team was reaching for need."] },
          { name: "The listed height is the real height", pill: "Not yet", cls: "na",
            cuts: ["What people say: Trust the media-guide number. That is how tall he is.", "What we found: We do not have listed height and combine height on the same players yet, so this stays here until that file exists."] },
          { name: "He can keep the weight on", pill: "Not yet", cls: "na",
            cuts: ["What people say: Some guys play at their listed weight. Some show up to camp 15 pounds light and stay that way.", "What we found: One combine weigh-in next to a media-guide number is not the same thing. We do not have a year-to-year playing-weight series."] }
        ]
      }
    ];

    function row(t) {
      var title = t.href
        ? '<a class="theory-name" href="' + t.href + '">' + t.name + '</a>'
        : '<span class="theory-name">' + t.name + '</span>';
      var plus = '<button class="theory-plus" data-acc type="button" aria-label="Toggle">+</button>';
      var factors = t.cuts.map(function (c) {
        return '<div class="factor"><span>' + c + '</span></div>';
      }).join('');
      var panel = '<div class="acc-panel"><div class="factor-list">' + factors + '</div></div>';
      return '<div class="acc-item theory-acc"><div class="theory-row">' + plus + title +
        '<span class="theory-pill ' + t.cls + '">' + t.pill + '</span></div>' + panel + '</div>';
    }

    function groupHint(g) {
      if (g.kind === "qual") return g.items.length + " not yet";
      return g.items.length + " checked";
    }

    var html = '<div class="acc theory-families">' + groups.map(function (g, i) {
      return '<section class="acc-item group-acc"><button class="acc-btn group-acc-btn" type="button" data-group="' + i + '"><b>' +
        g.label + '</b><em>' + groupHint(g) + ' <i>+</i></em></button><div class="acc-panel"><div class="acc theory-list">' +
        g.items.map(row).join('') + '</div></div></section>';
    }).join('') + '</div><p class="theory-method"><a href="./methodology.html">Methodology</a></p>';

    TR.renderSimple(
      document.getElementById("app"),
      "theories",
      "Theories",
      "",
      html
    );
    document.querySelectorAll("[data-group]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var item = btn.closest(".group-acc");
        item.classList.toggle("open");
        var icon = btn.querySelector("i");
        if (icon) icon.textContent = item.classList.contains("open") ? "\u2212" : "+";
      });
    });
    document.querySelectorAll("[data-acc]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var item = btn.closest(".theory-acc");
        item.classList.toggle("open");
        btn.textContent = item.classList.contains("open") ? "\u2212" : "+";
      });
    });
  </script>
</body>
</html>
