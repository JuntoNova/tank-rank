<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Theories | The Draft Model</title>
  <meta name="description" content="Draft theories scored against historic NBA drafts." />
  <link rel="canonical" href="https://thedraftmodel.com/theories.html" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#090a0c" />
  <link rel="stylesheet" href="./assets/styles.css?v=25" />
  <link rel="stylesheet" href="./assets/theories.css?v=25" />
</head>
<body>
  <div id="app"></div>
  <script src="./assets/data.js?v=25"></script>
  <script src="./assets/app.js?v=25"></script>
  <script src="./assets/nav-swap.js?v=25"></script>
  <script>
    const rows = [
      "You can't teach size",
      "College production is the best signal",
      "The best players play at the best schools",
      "March Madness tells you everything",
      "Younger is better at the same pick",
      "One-and-done beats four-year stars",
      "International is a different market",
      "Defense doesn't show up until the league"
    ].map((name) => `
      <div class="theory-row">
        <span class="theory-name">${name}</span>
        <span class="theory-pill na">N/A</span>
      </div>`).join("");
    TR.renderSimple(
      document.getElementById("app"),
      "theories",
      "Theories",
      "True or bullshit",
      `<div class="theory-list">${rows}</div>`
    );
  </script>
</body>
</html>
