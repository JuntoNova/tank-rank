<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA Draft Board | The Draft Model</title>
  <link rel="canonical" href="https://thedraftmodel.com/board.html" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#090a0c" />
  <link rel="stylesheet" href="./assets/styles.css?v=60" />
</head>
<body>
  <div id="app"></div>
  <script src="./assets/data.js?v=63"></script>
  <script src="./assets/trust-disclaimer.js?v=53"></script>
  <script src="./assets/app.js?v=73"></script>
  <script src="./assets/nav-swap.js?v=31"></script>
  <script src="./assets/boot-history.js?v=75"></script>
  <script src="./assets/measure.js?v=40"></script>
  <script src="./assets/theory-model.js?v=69"></script>
  <script src="./assets/theory-card.js?v=68"></script>
  <script src="./assets/theory-board.js?v=67"></script>
  <script src="./assets/yrs-overlay.js?v=1"></script>
  <script>TR.renderBoard(document.getElementById("app"));</script>
  <script>
    (function () {
      function yearOf() {
        return Number(new URLSearchParams(location.search).get("year")) || (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
      }
      function isFuture() {
        var cur = (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
        return yearOf() >= cur;
      }
      function scrubFooter() {
        document.querySelectorAll("footer .copy div, footer p, .foot .copy div").forEach(function (el) {
          var t = (el.textContent || "").replace(/\s+/g, " ").trim();
          if (/DBA of Junto Nova/i.test(t) || /Not affiliated with, endorsed by, or sponsored by the NBA/i.test(t)) el.remove();
        });
      }
      function syncChips() {
        var t = document.querySelector(".toolbar");
        if (!t) return false;
        if (isFuture()) {
          t.querySelectorAll("[data-view]").forEach(function (b) { b.remove(); });
          return true;
        }
        if (!t.querySelector("[data-view]")) {
          t.insertAdjacentHTML("afterbegin",
            '<button type="button" class="chip on" data-view="now">Now</button>' +
            '<button type="button" class="chip" data-view="drafted">When drafted</button>'
          );
        }
        return true;
      }
      document.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-view]");
        if (!b) return;
        var view = b.getAttribute("data-view");
        if (view === "then") view = "drafted";
        var url = new URL(location.href);
        if (view === "now") url.searchParams.delete("view");
        else url.searchParams.set("view", view);
        history.replaceState({}, "", url);
        document.querySelectorAll("[data-view]").forEach(function (x) {
          x.classList.toggle("on", x.getAttribute("data-view") === view);
        });
        var q = document.querySelector("#q");
        if (q) q.dispatchEvent(new Event("input", { bubbles: true }));
      });
      scrubFooter();
      setInterval(scrubFooter, 400);
      if (!syncChips()) {
        var n = 0;
        var id = setInterval(function () {
          n += 1;
          if (syncChips() || n > 40) clearInterval(id);
        }, 250);
      }
    })();
  </script>
</body>
</html>
