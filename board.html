<body>

  <script src="./assets/yrs-overlay.js?v=2"></script>
  <script>TR.renderBoard(document.getElementById("app"));</script>
  <script>
    (function () {
      function yearOf() {
        return Number(new URLSearchParams(location.search).get("year")) || (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
      }
      function isFuture() {
        var cur = (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
        return yearOf() >= cur;
      }
      function ensureHistoricBack() {
        var y = yearOf();
        var cur = (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
        if (y >= cur) return;
        var head = document.querySelector(".section-head");
        if (!head || head.querySelector(".back-historic")) return;
        var a = document.createElement("a");
        a.className = "btn ghost back-historic";
        a.href = "./drafts.html";
        a.textContent = "← Historic drafts";
        head.appendChild(a);
      }
      function scrubFooter() {
        document.querySelectorAll("footer .copy div, footer p, .foot .copy div").forEach(function (el) {
          var t = (el.textContent || "").replace(/\s+/g, " ").trim();
          if (/DBA of Junto Nova/i.test(t) || /Not affiliated with, endorsed by, or sponsored by the NBA/i.test(t)) el.remove();
        });
      }
      function syncChips() {
        var t = document.querySelector(".toolbar");
        if (!t) return false;
        if (isFuture()) {
          t.querySelectorAll("[data-view]").forEach(function (b) { b.remove(); });
          return true;
        }
        if (!t.querySelector("[data-view]")) {
          var draftedOn = yearOf() === ((window.TANK_RANK && TANK_RANK.currentYear) || 2027) - 1;
          t.insertAdjacentHTML("afterbegin",
            '<button type="button" class="chip' + (draftedOn ? "" : " on") + '" data-view="now">Now</button>' +
            '<button type="button" class="chip' + (draftedOn ? " on" : "") + '" data-view="drafted">When drafted</button>'
          );
        }
        return true;
      }
      document.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-view]");
        if (!b) return;
        var view = b.getAttribute("data-view");
        if (view === "then") view = "drafted";
        var url = new URL(location.href);
        var y = yearOf();
        var cur = (window.TANK_RANK && TANK_RANK.currentYear) || 2027;
        var def = (y >= cur - 1) ? "drafted" : "now";
        if (view === def) url.searchParams.delete("view");
        else url.searchParams.set("view", view);
        history.replaceState({}, "", url);
        document.querySelectorAll("[data-view]").forEach(function (x) {
          x.classList.toggle("on", x.getAttribute("data-view") === view);
        });
        var q = document.querySelector("#q");
        if (q) q.dispatchEvent(new Event("input", { bubbles: true }));
      });
      scrubFooter();
      setInterval(scrubFooter, 400);
      ensureHistoricBack();
      setInterval(ensureHistoricBack, 400);
      if (!syncChips()) {
        var n = 0;
        var id = setInterval(function () {
          n += 1;
          if (syncChips() || n > 40) clearInterval(id);
        }, 250);
      }
    })();
  </script>
</body>
</html>
